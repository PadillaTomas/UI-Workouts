name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS

      # Pure-logic tests — fast, run on the host.
      - name: swift test (logic)
        run: swift test

      # Visual-regression tests against the committed reference PNGs.
      # Reference images were recorded on iOS 26.5; if the runner ships a
      # different iOS the diff may fail on sub-pixel rendering — regenerate
      # locally with SNAPSHOT_RECORD=1 and commit.
      - name: xcodebuild test (snapshots)
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme UIWorkouts \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:UIWorkoutsSnapshotTests \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify

      # Prove the library still compiles for a real iOS target.
      - name: xcodebuild build (iOS library)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme UIWorkouts \
            -destination 'generic/platform=iOS' \
            | xcbeautify

      - name: Upload failed snapshot artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures
          path: TestResults.xcresult
          if-no-files-found: ignore
